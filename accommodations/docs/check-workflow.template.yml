name: Check isolated accommodation app
on:
  workflow_dispatch:
  pull_request:
    paths: ['accommodations/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accommodations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: accommodations/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
